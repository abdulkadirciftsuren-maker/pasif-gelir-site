<g fill="#5aa7d6" opacity=".9"><rect x="22" y="50" width="38" height="20" rx="3"/><rect x="66" y="50" width="38" height="20" rx="3"/><rect x="110" y="50" width="38" height="20" rx="3"/></g>
<rect x="60" y="92" width="50" height="16" rx="4" fill="#5b5b5b"/>
<path d="M64 130 h42 v34 q0 8 -8 8 h-26 q-8 0 -8 -8 z" fill="#fbf8f4"/>
