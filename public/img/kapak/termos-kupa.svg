<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Yan yana bir termos kupa, kapağı fincan olan uzun bir termos şişe ve yeniden kullanılabilir bir kahve bardağı; arkada kar taneleri">
<rect width="640" height="360" fill="#dfe9ec"/>
<circle cx="480" cy="80" r="130" fill="#d1e0e4"/>
<rect y="294" width="640" height="66" fill="#b7c9cf"/>
<!-- kar taneleri -->
<g stroke="#fbf8f4" stroke-width="3" stroke-linecap="round" opacity=".9">
<g transform="translate(90 70)"><path d="M0 -12 V12 M-10 -6 L10 6 M-10 6 L10 -6"/></g>
<g transform="translate(560 50)"><path d="M0 -9 V9 M-8 -4.5 L8 4.5 M-8 4.5 L8 -4.5"/></g>
<g transform="translate(330 40)"><path d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5"/></g>
</g>
<!-- termos kupa -->
<g transform="translate(120 112)">
<rect x="10" y="0" width="80" height="18" rx="6" fill="#2f3a40"/>
<rect x="56" y="-6" width="26" height="10" rx="4" fill="#c4562f"/>
<path d="M6 18 h88 l-6 158 q0 6 -6 6 h-64 q-6 0 -6 -6 z" fill="#2f5d8a"/>
<path d="M18 30 v120" stroke="#fbf8f4" stroke-width="6" stroke-linecap="round" opacity=".3"/>
<rect x="12" y="150" width="76" height="12" fill="#264c72"/>
</g>
<!-- termos şişe -->
<g transform="translate(272 64)">
<rect x="14" y="0" width="56" height="40" rx="6" fill="#4a7a5a"/>
<rect x="18" y="40" width="48" height="10" fill="#2f4a44"/>
<path d="M4 50 h76 v170 q0 10 -10 10 h-56 q-10 0 -10 -10 z" fill="#5f9270"/>
<path d="M16 64 v140" stroke="#fbf8f4" stroke-width="6" stroke-linecap="round" opacity=".3"/>
<rect x="4" y="96" width="76" height="8" fill="#4a7a5a"/>
<!-- fincan kapak yanda -->
<g transform="translate(96 184)">
<path d="M0 0 h50 l-4 40 q0 6 -6 6 h-30 q-6 0 -6 -6 z" fill="#4a7a5a"/>
<ellipse cx="25" cy="2" rx="25" ry="5" fill="#6b3f26"/>
<path d="M10 -10 q4 -8 0 -16 M24 -10 q4 -8 0 -16 M38 -10 q4 -8 0 -16" stroke="#fbf8f4" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
</g>
</g>
<!-- yeniden kullanılabilir bardak -->
<g transform="translate(462 150)">
<path d="M0 0 h86 l-4 12 h-78 z" fill="#2f3a40"/>
<rect x="36" y="-8" width="14" height="10" rx="3" fill="#2f3a40"/>
<path d="M6 12 h74 l-10 132 q0 6 -6 6 h-42 q-6 0 -6 -6 z" fill="#f3d9c4" opacity=".95"/>
<rect x="4" y="60" width="78" height="30" fill="#c4562f"/>
<path d="M20 110 h46" stroke="#fbf8f4" stroke-width="4" opacity=".5" stroke-linecap="round"/>
</g>
</svg>
