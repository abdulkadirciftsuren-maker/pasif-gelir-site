<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Üç basamakta üç kahve seti: moka pot, V60 ve terazi, tam otomatik kahve makinesi">
<rect width="640" height="360" fill="#fdf0e3"/>
<rect y="300" width="640" height="60" fill="#f3dcc4"/>
<!-- basamaklar -->
<rect x="60" y="250" width="160" height="50" rx="6" fill="#e8b84a"/>
<rect x="240" y="220" width="160" height="80" rx="6" fill="#1f7468"/>
<rect x="420" y="190" width="160" height="110" rx="6" fill="#c4562f"/>
<g fill="#fbf8f4" font-family="system-ui,sans-serif" font-weight="800" font-size="30" text-anchor="middle"><text x="140" y="286">1</text><text x="320" y="270">2</text><text x="500" y="256">3</text></g>
<!-- moka pot -->
<g transform="translate(140 0)">
<path d="M-26 250 L-20 206 H20 L26 250 Z" fill="#a9b3bd"/>
<rect x="-24" y="200" width="48" height="8" rx="2" fill="#7d8a97"/>
<path d="M-20 200 L-14 162 H14 L20 200 Z" fill="#a9b3bd"/>
<path d="M-14 162 L-8 152 H8 L14 162 Z" fill="#7d8a97"/>
<circle cy="148" r="4" fill="#2a211c"/>
<path d="M20 172 q20 2 18 22 q-2 14 -18 14" fill="none" stroke="#2a211c" stroke-width="7"/>
</g>
<!-- v60 + terazi -->
<rect x="270" y="210" width="100" height="12" rx="4" fill="#2a211c"/>
<path d="M286 150 H354 L336 184 H304 Z" fill="#fbf8f4" stroke="#d8c6b6" stroke-width="2"/>
<rect x="300" y="182" width="40" height="6" rx="2" fill="#d8c6b6"/>
<path d="M296 188 H344 L340 210 H300 Z" fill="#dfeef8" stroke="#9cc3d0" stroke-width="2"/>
<path d="M298 198 H342 L340 210 H300 Z" fill="#6b3f26"/>
<!-- tam otomatik -->
<g transform="translate(500 0)">
<rect x="-46" y="90" width="92" height="100" rx="10" fill="#2a211c"/>
<rect x="-30" y="100" width="60" height="22" rx="4" fill="#1f7468"/>
<rect x="-34" y="82" width="68" height="12" rx="4" fill="#3a2f28"/>
<rect x="-32" y="140" width="64" height="44" rx="4" fill="#1a1411"/>
<path d="M-14 158 H14 L12 180 H-12 Z" fill="#fbf8f4"/>
<rect x="-6" y="132" width="12" height="10" rx="2" fill="#6a5a50"/>
</g>
</svg>
