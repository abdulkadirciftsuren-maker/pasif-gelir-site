<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Üstü köpüklü ve tarçın serpilmiş bir bardak chai latte; yanında tarçın çubukları, yıldız anason, kakule taneleri ve küçük bir kase siyah çay">
<rect width="640" height="360" fill="#efe0c9"/>
<circle cx="520" cy="70" r="120" fill="#e6d2b4"/>
<rect y="290" width="640" height="70" fill="#c8a882"/>
<!-- chai bardağı -->
<g transform="translate(230 92)">
<path d="M0 0 h150 l-12 196 q0 8 -8 8 h-110 q-8 0 -8 -8 z" fill="#ffffff" opacity=".5" stroke="#fbf8f4" stroke-width="4"/>
<path d="M6 60 h138 l-8 136 q0 6 -6 6 h-110 q-6 0 -6 -6 z" fill="#c08a5c"/>
<path d="M6 60 h138 l-1 20 h-136 z" fill="#d6a679"/>
<path d="M4 22 h142 v40 h-142 z" fill="#f6ead9"/>
<ellipse cx="75" cy="22" rx="71" ry="10" fill="#fbf8f4"/>
<g fill="#8a5a3c"><circle cx="50" cy="20" r="2.2"/><circle cx="66" cy="24" r="1.8"/><circle cx="82" cy="19" r="2.4"/><circle cx="98" cy="23" r="1.8"/><circle cx="74" cy="17" r="1.6"/><circle cx="58" cy="15" r="1.6"/></g>
<path d="M150 50 q36 4 34 48 q-2 40 -40 44" fill="none" stroke="#fbf8f4" stroke-width="10" opacity=".7"/>
</g>
<!-- buhar -->
<g stroke="#fbf8f4" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85">
<path d="M285 74 q8 -14 0 -28 q-8 -14 0 -28"/><path d="M315 74 q8 -14 0 -28 q-8 -14 0 -28"/><path d="M345 74 q8 -14 0 -28 q-8 -14 0 -28"/>
</g>
<!-- tarçın çubukları -->
<g transform="translate(30 300) rotate(-6)">
<rect x="0" y="0" width="120" height="16" rx="8" fill="#8a4f2a"/>
<rect x="6" y="20" width="110" height="16" rx="8" fill="#9b5a31"/>
<path d="M4 8 h112 M10 28 h100" stroke="#6b3a1d" stroke-width="2" opacity=".5"/>
</g>
<!-- yıldız anason -->
<g transform="translate(470 306)" fill="#6b3a1d">
<path d="M0 0 L6 -24 L12 0 Z" transform="translate(-6 0)"/>
<path d="M0 0 L6 -24 L12 0 Z" transform="rotate(72) translate(-6 0)"/>
<path d="M0 0 L6 -24 L12 0 Z" transform="rotate(144) translate(-6 0)"/>
<path d="M0 0 L6 -24 L12 0 Z" transform="rotate(216) translate(-6 0)"/>
<path d="M0 0 L6 -24 L12 0 Z" transform="rotate(288) translate(-6 0)"/>
<circle r="5" fill="#8a4f2a"/>
</g>
<!-- kakule -->
<g fill="#8fae6a">
<ellipse cx="530" cy="290" rx="9" ry="5" transform="rotate(-20 530 290)"/>
<ellipse cx="548" cy="284" rx="9" ry="5" transform="rotate(25 548 284)"/>
<ellipse cx="540" cy="300" rx="9" ry="5" transform="rotate(5 540 300)"/>
</g>
<!-- çay kasesi -->
<g transform="translate(150 316)">
<path d="M0 0 h80 q0 30 -40 30 q-40 0 -40 -30 z" fill="#2f4a44"/>
<ellipse cx="40" cy="0" rx="40" ry="8" fill="#3a2a22"/>
<g fill="#5a3a26"><ellipse cx="28" cy="-2" rx="5" ry="2"/><ellipse cx="46" cy="0" rx="5" ry="2"/><ellipse cx="38" cy="-4" rx="5" ry="2"/></g>
</g>
</svg>
