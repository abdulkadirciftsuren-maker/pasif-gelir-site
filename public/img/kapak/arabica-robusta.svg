<circle cx="424" cy="180" r="44" fill="#7a4424" opacity=".5"/>
<path d="M446 118 L436 274" stroke="#2a1206" stroke-width="9" fill="none" stroke-linecap="round"/>
<g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-weight="700" text-anchor="middle">
<rect x="150" y="306" width="140" height="36" rx="18" fill="#fbf8f4"/><text x="220" y="330" font-size="18" fill="#7a3f1f">Arabica</text>
<rect x="370" y="306" width="140" height="36" rx="18" fill="#fbf8f4"/><text x="440" y="330" font-size="18" fill="#5a3018">Robusta</text>
</g>
</svg>
