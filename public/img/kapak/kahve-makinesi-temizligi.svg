<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Parlayan temiz bir espresso makinesi, yanında köpüklü sünger, temizlik fırçası, temizlik tabletleri ve sabun köpükleri">
<rect width="640" height="360" fill="#dff0f2"/>
<circle cx="520" cy="80" r="120" fill="#cfe7ea"/>
<rect y="290" width="640" height="70" fill="#a9cfd4"/>
<!-- köpükler -->
<g fill="#fbf8f4" stroke="#bfe0e4" stroke-width="2" opacity=".9">
<circle cx="70" cy="80" r="18"/><circle cx="100" cy="56" r="10"/><circle cx="560" cy="200" r="14"/><circle cx="590" cy="176" r="8"/><circle cx="430" cy="60" r="12"/>
</g>
<!-- makine -->
<g transform="translate(200 104)">
<rect x="0" y="0" width="190" height="186" rx="12" fill="#c9ccd1"/>
<rect x="0" y="0" width="190" height="50" rx="12" fill="#9aa3a8"/>
<g fill="#2f3a40"><circle cx="40" cy="25" r="10"/><circle cx="150" cy="25" r="10"/></g>
<rect x="76" y="16" width="38" height="18" rx="3" fill="#2f3a40"/><rect x="82" y="21" width="26" height="8" rx="2" fill="#6cc7b6"/>
<rect x="70" y="62" width="50" height="18" rx="4" fill="#7d868b"/>
<rect x="56" y="80" width="78" height="10" rx="5" fill="#2f3a40"/>
<path d="M130 85 L176 96" stroke="#2f3a40" stroke-width="10" stroke-linecap="round"/>
<rect x="30" y="160" width="130" height="10" rx="5" fill="#7d868b"/>
<path d="M20 60 v70 l8 10" stroke="#7d868b" stroke-width="6" fill="none" stroke-linecap="round"/>
<!-- parıltılar -->
<g fill="#fbf8f4">
<path d="M150 120 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
<path d="M30 30 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" transform="translate(140 -8)"/>
</g>
</g>
<!-- sünger -->
<g transform="translate(60 250) rotate(-8)">
<rect x="0" y="0" width="90" height="26" rx="6" fill="#f2c46b"/>
<rect x="0" y="22" width="90" height="16" rx="5" fill="#4a7a5a"/>
<g fill="#fbf8f4" opacity=".95"><circle cx="20" cy="-4" r="10"/><circle cx="40" cy="-8" r="13"/><circle cx="62" cy="-4" r="9"/></g>
</g>
<!-- fırça -->
<g transform="translate(408 300) rotate(-6)">
<rect x="0" y="0" width="90" height="12" rx="6" fill="#c4562f"/>
<rect x="88" y="-8" width="40" height="28" rx="4" fill="#2f3a40"/>
<g stroke="#5b6b75" stroke-width="2"><path d="M92 20 v10 M98 20 v10 M104 20 v10 M110 20 v10 M116 20 v10 M122 20 v10"/></g>
</g>
<!-- tabletler -->
<g transform="translate(450 330)" fill="#fbf8f4" stroke="#9aa3a8" stroke-width="2">
<ellipse cx="0" cy="0" rx="14" ry="6"/><ellipse cx="34" cy="4" rx="14" ry="6"/><ellipse cx="66" cy="-2" rx="14" ry="6"/>
</g>
</svg>
