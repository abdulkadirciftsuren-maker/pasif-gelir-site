<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="İçinde kahve demlenen büyük bir cam sürahi, buzlu bir bardak cold brew ve kahve çekirdekleri">
<rect width="640" height="360" fill="#e3f4f2"/>
<circle cx="110" cy="80" r="110" fill="#d0ebe7"/>
<rect y="300" width="640" height="60" fill="#c2e2dd"/>
<!-- sürahi -->
<rect x="150" y="90" width="130" height="210" rx="18" fill="#e6f1f4" opacity=".85" stroke="#9cc3d0" stroke-width="3"/>
<rect x="155" y="130" width="120" height="166" rx="14" fill="#4a2c1c"/>
<rect x="190" y="70" width="50" height="40" rx="6" fill="#9aa7b4"/>
<rect x="196" y="100" width="38" height="150" rx="6" fill="#fbf8f4" opacity=".35"/>
<rect x="196" y="100" width="38" height="110" rx="6" fill="#6b3f26" opacity=".7"/>
<path d="M280 130 q34 6 30 56 q-4 40 -30 46" fill="none" stroke="#9cc3d0" stroke-width="10"/>
<!-- saat simgesi -->
