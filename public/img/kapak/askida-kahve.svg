<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Napoli'de bir kafe tezgâhı: iki espresso fincanı, bir bardak su ve duvarda mandalla asılmış, üzerinde fincan çizili küçük bir kâğıt fiş">
<rect width="640" height="360" fill="#f3e3c9"/>
<!-- duvar çinileri -->
<g fill="#e8d2ad"><rect x="0" y="0" width="640" height="14"/></g>
<g stroke="#e4caa0" stroke-width="2"><path d="M0 60 H640 M0 120 H640 M0 180 H640"/><path d="M80 0 V200 M160 0 V200 M240 0 V200 M320 0 V200 M400 0 V200 M480 0 V200 M560 0 V200"/></g>
<!-- askı ipi ve fişler -->
<path d="M120 60 Q320 92 520 60" stroke="#6e4630" stroke-width="3" fill="none"/>
<g transform="translate(236 74) rotate(-4)">
<rect x="-6" y="-8" width="12" height="16" rx="2" fill="#b9562a"/>
<rect x="-30" y="6" width="60" height="78" rx="3" fill="#fffaf0" stroke="#d9c7a6" stroke-width="2"/>
<path d="M-16 32 h26 l-3 20 q-1 4 -5 4 h-10 q-4 0 -5 -4 z" fill="#3b2213"/>
<path d="M10 37 q9 0 8 7 q-1 6 -10 6" stroke="#3b2213" stroke-width="3" fill="none"/>
<path d="M-20 66 h40 M-20 74 h26" stroke="#c9b9a2" stroke-width="3"/>
</g>
<g transform="translate(404 74) rotate(5)">
<rect x="-6" y="-8" width="12" height="16" rx="2" fill="#1f7468"/>
<rect x="-30" y="6" width="60" height="78" rx="3" fill="#fffaf0" stroke="#d9c7a6" stroke-width="2"/>
<path d="M-16 32 h26 l-3 20 q-1 4 -5 4 h-10 q-4 0 -5 -4 z" fill="#3b2213"/>
<path d="M10 37 q9 0 8 7 q-1 6 -10 6" stroke="#3b2213" stroke-width="3" fill="none"/>
<path d="M-20 66 h40 M-20 74 h26" stroke="#c9b9a2" stroke-width="3"/>
</g>
<!-- tezgâh -->
<rect y="248" width="640" height="112" fill="#2f3a40"/>
<rect y="240" width="640" height="14" fill="#c9b9a2"/>
<!-- fincanlar -->
<g transform="translate(220 196)">
<ellipse cx="34" cy="44" rx="44" ry="8" fill="#fbf8f2"/>
