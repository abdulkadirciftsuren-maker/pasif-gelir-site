<g><path d="M0 0 h40 v34 q0 8 -8 8 h-24 q-8 0 -8 -8 z" fill="#c4562f"/><path d="M40 8 q12 0 10 12 q-2 8 -10 8" fill="none" stroke="#c4562f" stroke-width="5"/></g>
