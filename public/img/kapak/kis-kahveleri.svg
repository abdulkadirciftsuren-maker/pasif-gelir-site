<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Krem şantili büyük bir kış latte kupası, yanında küçük bir balkabağı, tarçın çubukları, yıldız anason ve zencefilli kurabiye; arkada kar taneleri">
