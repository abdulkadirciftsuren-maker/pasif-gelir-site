<circle cx="560" cy="60" r="120" fill="#d3e4bb"/>
<rect y="300" width="640" height="60" fill="#c8dcae"/>
<!-- yapraklar -->
<g fill="#5f8f4e"><path d="M40 300 q10 -90 90 -120 q-20 80 -90 120z"/><path d="M600 300 q-14 -80 -90 -104 q16 74 90 104z"/></g>
<g stroke="#4a7a3c" stroke-width="3" fill="none"><path d="M44 296 q34 -60 82 -112"/><path d="M596 296 q-28 -52 -82 -96"/></g>
<!-- arabica: oval, S kıvrımlı yarık -->
