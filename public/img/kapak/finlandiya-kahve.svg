<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Karlı bir orman önünde ahşap bir göl evi; masada bir fincan açık kavrum filtre kahve, tarçınlı çörek ve bir termos; gökyüzünde kuzey ışıkları">
<rect width="640" height="360" fill="#1d2a44"/>
<path d="M0 90 q160 -60 320 -10 t320 -20 v40 q-160 30 -320 0 t-320 20z" fill="#3fbf8f" opacity=".45"/>
<path d="M0 120 q180 -40 340 0 t300 -10 v24 q-150 20 -300 -6 t-340 10z" fill="#6fd3b0" opacity=".3"/>
<g fill="#ffffff"><circle cx="60" cy="40" r="1.6"/><circle cx="200" cy="30" r="1.4"/><circle cx="420" cy="26" r="1.6"/><circle cx="560" cy="50" r="1.4"/><circle cx="300" cy="60" r="1.2"/></g>
<!-- ormanlar -->
<g fill="#13202f"><path d="M0 250 l30 -70 30 70z"/><path d="M40 250 l34 -84 34 84z"/><path d="M500 250 l32 -76 32 76z"/><path d="M560 250 l36 -90 36 90z"/><path d="M600 250 l26 -60 26 60z"/></g>
<!-- kar -->
<rect y="246" width="640" height="114" fill="#e8eef5"/>
<!-- göl evi -->
<g transform="translate(120 160)">
<rect x="0" y="40" width="150" height="90" fill="#a63a2b"/>
<path d="M-12 44 l87 -56 87 56z" fill="#5a2a22"/>
<path d="M-12 44 l87 -56 87 56" fill="none" stroke="#ffffff" stroke-width="6"/>
<rect x="22" y="66" width="34" height="30" fill="#f4d58d"/><rect x="96" y="66" width="34" height="30" fill="#f4d58d"/>
<path d="M39 66 v30 M22 81 h34 M113 66 v30 M96 81 h34" stroke="#a63a2b" stroke-width="3"/>
<rect x="64" y="90" width="22" height="40" fill="#5a2a22"/>
</g>
<!-- masa -->
<rect x="330" y="262" width="250" height="14" rx="4" fill="#8a5a3c"/>
<rect x="350" y="276" width="10" height="60" fill="#6e4630"/><rect x="550" y="276" width="10" height="60" fill="#6e4630"/>
<!-- termos -->
<g transform="translate(350 182)"><rect x="0" y="12" width="40" height="70" rx="8" fill="#c63a2c"/><rect x="6" y="0" width="28" height="16" rx="4" fill="#2f3a40"/><rect x="0" y="40" width="40" height="8" fill="#a12d22"/></g>
<!-- fincan -->
<g transform="translate(420 222)">
<path d="M0 0 h50 l-5 36 q-1 6 -7 6 h-26 q-6 0 -7 -6 z" fill="#fbf8f2"/>
<path d="M48 8 q15 0 13 12 q-2 10 -15 10" stroke="#fbf8f2" stroke-width="6" fill="none"/>
<ellipse cx="25" cy="3" rx="23" ry="4" fill="#9a6a3c"/>
<path d="M14 -8 q-6 -10 2 -20 M30 -8 q-6 -10 2 -20" stroke="#cfd8df" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>
<!-- çörek -->
<g transform="translate(510 246)"><ellipse cx="22" cy="10" rx="24" ry="9" fill="#c98a4b"/><path d="M22 10 m-14 0 a14 6 0 1 0 14 -6 a9 4 0 1 0 -9 4" stroke="#8a5428" stroke-width="3" fill="none"/></g>
</svg>
