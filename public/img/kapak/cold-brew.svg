<!-- bardak -->
<path d="M420 170 H500 L492 300 H428 Z" fill="#e6f1f4" opacity=".9" stroke="#9cc3d0" stroke-width="3"/>
<path d="M423 200 H497 L492 300 H428 Z" fill="#6b3f26"/>
<g fill="#ffffff" opacity=".8" stroke="#cfe2e8" stroke-width="2"><rect x="432" y="196" width="24" height="22" rx="4" transform="rotate(-10 444 207)"/><rect x="462" y="204" width="24" height="22" rx="4" transform="rotate(12 474 215)"/><rect x="446" y="226" width="22" height="20" rx="4" transform="rotate(6 457 236)"/></g>
<path d="M470 130 L478 196" stroke="#1f7468" stroke-width="7" stroke-linecap="round"/>
<!-- çekirdekler -->
<g transform="translate(560 300) rotate(20)"><ellipse rx="13" ry="9" fill="#5a3522"/><path d="M-11 0 Q-4 -5 0 0 T11 0" fill="none" stroke="#2a1810" stroke-width="2.2"/></g>
<g transform="translate(590 316) rotate(140)"><ellipse rx="13" ry="9" fill="#5a3522"/><path d="M-11 0 Q-4 -5 0 0 T11 0" fill="none" stroke="#2a1810" stroke-width="2.2"/></g>
</svg>
