<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Ofis mutfağında tezgahta büyük ekranlı profesyonel tam otomatik kahve makinesi, termos sürahili filtre kahve makinesi, kupalar ve duvarda bir pano">
<rect width="640" height="360" fill="#e7e5df"/>
<rect x="0" y="0" width="640" height="40" fill="#dcd9d1"/>
<!-- pano -->
<g transform="translate(470 60)">
<rect x="0" y="0" width="130" height="90" rx="4" fill="#c9a77a"/>
<rect x="8" y="8" width="114" height="74" rx="2" fill="#d9bb90"/>
<rect x="18" y="18" width="40" height="30" fill="#f2c46b" transform="rotate(-4 38 33)"/>
