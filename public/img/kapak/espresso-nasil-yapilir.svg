<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Terazinin üstünde bir espresso fincanı, içine akan espresso, yanında portafiltre ve tamper; terazide 36 g ve 28 saniye yazıyor">
