<rect x="30" y="54" width="60" height="20" fill="#9fc7e0" transform="rotate(-2 60 64)"/>
</g>
<rect y="282" width="640" height="78" fill="#9aa3a8"/>
<rect y="282" width="640" height="10" fill="#7d868b"/>
<!-- profesyonel tam otomatik -->
