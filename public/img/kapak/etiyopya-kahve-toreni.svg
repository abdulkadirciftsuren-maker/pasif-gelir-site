<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Etiyopya kahve töreni: hasır altlık üzerinde uzun boyunlu siyah toprak jebena demliği, tepside kulpsuz küçük fincanlar, yanında tütsü dumanı ve yerde taze yeşil otlar">
