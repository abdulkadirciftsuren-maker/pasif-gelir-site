<ellipse cx="206" cy="176" rx="40" ry="62" fill="#9a5631" opacity=".55" transform="rotate(-18 220 190)"/>
<path d="M248 98 C200 140 250 200 200 240 C180 256 192 272 186 286" stroke="#3a1a0a" stroke-width="9" fill="none" stroke-linecap="round"/>
