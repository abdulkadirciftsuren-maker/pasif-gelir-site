<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Viyana kahvehanesi: yuvarlak mermer masa, kıvrık ahşap Thonet sandalye, gümüş tepside bir fincan melange ve bir bardak su, yanında tahta çubuğa takılı bir gazete">
<rect width="640" height="360" fill="#5b2f2a"/>
<!-- duvar paneli ve avize -->
<rect y="0" width="640" height="200" fill="#6e3a33"/>
<g stroke="#8a4c43" stroke-width="3" fill="none"><rect x="30" y="30" width="160" height="140" rx="4"/><rect x="240" y="30" width="160" height="140" rx="4"/><rect x="450" y="30" width="160" height="140" rx="4"/></g>
<path d="M320 0 v40" stroke="#c9a227" stroke-width="3"/>
<g fill="#f4d58d"><circle cx="290" cy="54" r="9"/><circle cx="320" cy="58" r="9"/><circle cx="350" cy="54" r="9"/></g>
<path d="M286 44 q34 18 68 0" stroke="#c9a227" stroke-width="4" fill="none"/>
<rect y="200" width="640" height="160" fill="#4a2722"/>
<!-- sandalye -->
<g transform="translate(420 140)" stroke="#2b1a14" stroke-width="7" fill="none" stroke-linecap="round">
<path d="M10 120 V30 q0 -26 30 -26 q30 0 30 26 V70"/>
<ellipse cx="40" cy="30" rx="18" ry="20"/>
<path d="M0 120 h80"/><path d="M6 124 l-8 80 M74 124 l8 80 M20 124 l-2 80 M60 124 l2 80"/>
<ellipse cx="40" cy="170" rx="34" ry="6"/>
</g>
<!-- masa -->
<g transform="translate(150 196)">
<ellipse cx="120" cy="10" rx="140" ry="22" fill="#ece8e2"/>
<path d="M30 8 q40 8 80 0 M140 14 q30 6 70 -4" stroke="#cfc8be" stroke-width="2" fill="none"/>
<rect x="110" y="28" width="20" height="110" fill="#1e1a18"/>
<ellipse cx="120" cy="140" rx="50" ry="8" fill="#1e1a18"/>
</g>
<!-- tepsi, fincan, su -->
<g transform="translate(190 160)">
<ellipse cx="70" cy="44" rx="74" ry="12" fill="#c8ccd0"/>
<ellipse cx="70" cy="42" rx="66" ry="9" fill="#dfe3e6"/>
<g transform="translate(26 6)">
<ellipse cx="22" cy="34" rx="30" ry="6" fill="#fbf8f2"/>
<path d="M0 0 h44 l-4 28 q-1 6 -7 6 h-22 q-6 0 -7 -6 z" fill="#fbf8f2"/>
<path d="M42 8 q14 0 12 10 q-2 9 -14 9" stroke="#fbf8f2" stroke-width="5" fill="none"/>
<ellipse cx="22" cy="2" rx="21" ry="4" fill="#d9b98c"/>
</g>
<g transform="translate(96 -6)"><path d="M0 0 h26 l-3 44 h-20 z" fill="#dfe8ea" opacity=".8"/><path d="M2 14 h22 l-2 30 h-18 z" fill="#bcd4dc" opacity=".8"/></g>
</g>
<!-- gazete -->
<g transform="translate(60 120) rotate(-8)">
<rect x="0" y="0" width="90" height="120" fill="#f3efe4"/>
<rect x="-6" y="-6" width="102" height="10" rx="4" fill="#8a5a3c"/>
<g stroke="#9a948a" stroke-width="3"><path d="M10 20 h70 M10 32 h70 M10 44 h50 M10 60 h30 M48 60 h32 M10 72 h30 M48 72 h32 M10 84 h30 M48 84 h32 M10 96 h70"/></g>
</g>
</svg>
