<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Küçükten büyüğe dizilmiş espresso fincanı, Türk kahvesi fincanı, çay bardağı ve büyük filtre kahve kupası; üstlerinde yükselen çubuklar ve bir kafein molekülü çizimi">
